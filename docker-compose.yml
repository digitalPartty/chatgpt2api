services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatgpt2api
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    env_file:
      - .env
    networks:
      - chatgpt2api-net
      - sub2api-network  # 加入 sub2api 网络，可以直接调用 sub2api 服务

networks:
  chatgpt2api-net:
    external: true
    name: chatgpt2api-net
  sub2api-network:
    external: true
    name: sub2api-network  # 使用 sub2api 的网络
