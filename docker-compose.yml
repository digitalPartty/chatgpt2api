services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatgpt2api
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    env_file:
      - .env
    networks:
      - chatgpt2api-net

networks:
  chatgpt2api-net:
    external: true
    name: chatgpt2api-net
